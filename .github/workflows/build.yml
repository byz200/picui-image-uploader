# Picui 图床上传工具 - GitHub Actions CI/CD
# 自动构建 windows/amd64 与 windows/386 单文件 exe，并在打 tag 时发布 Release
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_release:
        description: '创建正式 Release（需要打 v* tag）'
        type: boolean
        default: false

permissions:
  contents: write   # 发布 Release 需要
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: x64
          - goarch: 386
            suffix: x86

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Add Go bin to PATH
        run: |
          $goBin = (go env GOPATH) + "\bin"
          echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GOROOT: $(go env GOROOT)"
          echo "GOPATH: $(go env GOPATH)"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.1
          $goBin = (go env GOPATH) + "\bin"
          if (Test-Path "$goBin\wails.exe") {
            echo "Wails CLI installed at $goBin\wails.exe"
            & "$goBin\wails.exe" version
          } else {
            Write-Error "Wails CLI not found after install"
            exit 1
          }

      - name: Verify Wails system dependencies
        run: |
          $goBin = (go env GOPATH) + "\bin"
          & "$goBin\wails.exe" doctor || true

      - name: Tidy Go modules
        run: |
          go mod tidy
          go mod verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if (Test-Path "package-lock.json") {
            echo "package-lock.json found, using npm ci"
            npm ci --no-audit --no-fund
          } else {
            echo "No package-lock.json, using npm install"
            npm install --no-audit --no-fund --no-package-lock
          }

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Verify frontend build output
        run: |
          if (-not (Test-Path "frontend\dist\index.html")) {
            Write-Error "frontend\dist\index.html 未生成，前端构建失败"
            exit 1
          }
          $size = (Get-ChildItem -Recurse "frontend\dist" | Measure-Object -Property Length -Sum).Sum
          echo "前端构建产物总大小: $([math]::Round($size/1KB,2)) KB"

      - name: Build exe (windows/${{ matrix.goarch }})
        run: |
          $goBin = (go env GOPATH) + "\bin"
          $rsrc = "$goBin\rsrc.exe"

          # 步骤0: 先安装 rsrc（HOST 原生架构 amd64，不设置 GOARCH=386，避免装到 windows_386 子目录）
          echo "--- Installing akavel/rsrc (host arch amd64) ---"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"          # 强制用 amd64 安装（CI Runner 是 64 位）
          go install github.com/akavel/rsrc@latest
          if (-not (Test-Path $rsrc)) {
            Write-Error "rsrc.exe 未安装到 $rsrc"
            exit 1
          }
          echo "rsrc installed: $rsrc (size: $([math]::Round((Get-Item $rsrc).Length/1KB,2)) KB)"

          # 设置目标构建架构（只影响 go install 业务包和 go build）
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          if ("${{ matrix.goarch }}" -eq "386") {
            $env:CGO_ENABLED = "0"
            echo "x86 target build: CGO_ENABLED=0"
          }

          echo ""
          echo "=== Target build config ==="
          echo "GOOS=$env:GOOS GOARCH=$env:GOARCH CGO_ENABLED=$env:CGO_ENABLED"
          echo "GOROOT=$(go env GOROOT) GOPATH=$(go env GOPATH)"
          echo "GOCACHE=$(go env GOCACHE)"

          # 步骤1: 安装标准库与依赖（确保 prebuilt .a 存在）
          echo ""
          echo "--- go install std + ./... (target windows/${{ matrix.goarch }}) ---"
          go install std
          go install ./...
          echo "Pre-install complete"

          # 步骤3: 生成 syso 资源文件（图标 ID=1 + manifest）
          # syso 文件名格式 rsrc_windows_<arch>.syso 会被 go build 自动按架构链接
          echo ""
          echo "--- Generating syso resource ---"
          $sysoName = "rsrc_windows_${{ matrix.goarch }}.syso"
          & $rsrc -manifest "build\windows\PicuiUploader.manifest" `
                   -ico      "build\windows\icon.ico" `
                   -o        $sysoName
          if (-not (Test-Path $sysoName)) {
            Write-Error "生成 $sysoName 失败"
            exit 1
          }
          $sysoLen = (Get-Item $sysoName).Length
          echo "Generated $sysoName ($([math]::Round($sysoLen/1KB,2)) KB)"

          # 步骤4: 创建输出目录并执行纯 go build（彻底绕过 wails build，彻底避免 "bytes without types"）
          echo ""
          echo "--- Pure go build ---"
          if (-not (Test-Path "build\bin")) { New-Item -ItemType Directory -Force -Path "build\bin" | Out-Null }
          $out = "build\bin\PicuiUploader-${{ matrix.suffix }}.exe"

          $ldflags = "-s -w -H windowsgui"
          $tags = "desktop,production"
          echo "go build -trimpath -tags `"$tags`" -ldflags `"$ldflags`" -o $out"

          go build -trimpath -tags $tags -ldflags $ldflags -o $out .
          $buildExit = $LASTEXITCODE

          # 构建完成后清理 syso（避免下次污染）
          Remove-Item -Force $sysoName -ErrorAction SilentlyContinue

          echo ""
          echo "=== go build exit code: $buildExit ==="
          if ($buildExit -ne 0 -or -not (Test-Path $out)) {
            Write-Error "纯 go build 失败：exit=$buildExit, exists=$(Test-Path $out)"
            exit 1
          }

          $len = (Get-Item $out).Length
          echo "产物: $out ($([math]::Round($len/1MB,2)) MB)"
          Get-ChildItem build\bin | Format-Table Name,Length

      - name: Verify executable PE architecture
        run: |
          $exe = "build\bin\PicuiUploader-${{ matrix.suffix }}.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $e_lfanew = [BitConverter]::ToInt32($bytes, 0x3C)
          $machineValue = [BitConverter]::ToUInt16($bytes, $e_lfanew + 4)
          $machineHex = $machineValue.ToString("X4")
          echo "PE machine field: 0x$machineHex"

          # 0x8664 = AMD64 (x64), 0x014C = I386 (x86)
          $expectedHex = if ("${{ matrix.goarch }}" -eq "amd64") { "8664" } else { "014C" }
          $expectedArch = if ("${{ matrix.goarch }}" -eq "amd64") { "AMD64" } else { "I386" }

          if ($machineHex -ne $expectedHex) {
            Write-Error "架构不匹配：期望 0x$expectedHex ($expectedArch)，实际 0x$machineHex"
            exit 1
          }
          echo "架构校验通过：$expectedArch (0x$machineHex) ✓"

      - name: Generate SHA256 checksum
        run: |
          $exe = "build\bin\PicuiUploader-${{ matrix.suffix }}.exe"
          $sum = (Get-FileHash -Algorithm SHA256 $exe).Hash
          echo "$sum  PicuiUploader-${{ matrix.suffix }}.exe" | Out-File -Encoding ascii -FilePath "build\bin\PicuiUploader-${{ matrix.suffix }}.sha256"
          echo "SHA256: $sum"
          Get-Content "build\bin\PicuiUploader-${{ matrix.suffix }}.sha256"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicuiUploader-${{ matrix.suffix }}
          path: build/bin/PicuiUploader-${{ matrix.suffix }}.exe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicuiUploader-${{ matrix.suffix }}-checksum
          path: build/bin/PicuiUploader-${{ matrix.suffix }}.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -lh artifacts/
          echo "---"
          cat artifacts/*.sha256 2>/dev/null || true

      - name: Merge checksums
        run: |
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          echo "Merged SHA256SUMS:"
          cat artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PicuiUploader ${{ github.ref_name }}
          body: |
            ## Picui 图床上传工具 ${{ github.ref_name }}

            ### 下载

            | 文件 | 架构 |
            |------|------|
            | `PicuiUploader-x64.exe` | Windows 64 位（amd64 / x86_64） |
            | `PicuiUploader-x86.exe` | Windows 32 位（386 / x86） |
            | `SHA256SUMS` | 校验和 |

            ### 校验

            ```powershell
            Get-FileHash -Algorithm SHA256 PicuiUploader-x64.exe
            Get-FileHash -Algorithm SHA256 PicuiUploader-x86.exe
            ```

            与 `SHA256SUMS` 中的值对比即可。

            ### 说明

            - 单文件绿色程序，下载后可直接运行，无需安装
            - 支持 Windows 10 / Windows 11
            - 首次启动请选择站点（picui.cn / v2.picui.cn）
            - 配置文件存储于 `%APPDATA%\PicuiUploader\config.json`
            - 上传历史按站点独立存储
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
